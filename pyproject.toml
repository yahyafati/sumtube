[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sumtube"
version = "0.1.0"
description = "YouTube Video Summarizer powered by LangChain and your choice of LLM"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["youtube", "summarizer", "llm", "langchain", "transcript"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Video",
  "Topic :: Text Processing :: General",
]

dependencies = [
  "langchain==1.2.10",
  "langchain-core==1.2.18",
  "pathvalidate>=3.3.1",
  "python-dotenv>=1.0",
  "rich>=14.3.3",
  "youtube-transcript-api>=1.2.4",
  "yt-dlp>=2026.3.3",
]

[project.optional-dependencies]
openai = ["langchain-openai>=1.1.11"]
anthropic = ["langchain-anthropic>=1.3.4"]
google = ["langchain-google-genai>=4.2.1"]
groq = ["langchain-groq>=1.1.2"]
mistral = ["langchain-mistralai>=1.1.1"]
ollama = ["langchain-ollama>=1.0.1"]

# Install everything
all = [
  "langchain-openai>=1.1.11",
  "langchain-anthropic>=1.3.4",
  "langchain-google-genai>=4.2.1",
  "langchain-groq>=1.1.2",
  "langchain-mistralai>=1.1.1",
  "langchain-ollama>=1.0.1",
]

[project.scripts]
sumtube = "sumtube.cli:main"

[project.urls]
Repository = "https://github.com/yahyafati/sumtube"

# ---------------------------------------------------------------------------
# Hatch
# ---------------------------------------------------------------------------
[tool.hatch.build.targets.wheel]
packages = ["sumtube"]

# ---------------------------------------------------------------------------
# Ruff (linting & formatting)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true